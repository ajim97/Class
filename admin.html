<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin Panel</title>
</head>
<body>
  <h1>Admin Push Panel</h1>
  <form id="pushForm">
    <input id="title" placeholder="Title" required><br><br>
    <input id="body" placeholder="Message" required><br><br>
    <input id="url" placeholder="Click URL" value="/"><br><br>
    <button type="submit">Send Notification</button>
  </form>
  <p id="status"></p>

  <script>
    document.getElementById("pushForm").onsubmit = async (e) => {
      e.preventDefault();
      const title = document.getElementById("title").value;
      const body = document.getElementById("body").value;
      const url = document.getElementById("url").value;

      const res = await fetch("/notify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, body, url })
      });
      const data = await res.json();
      document.getElementById("status").textContent = `✅ Sent: ${data.sent}`;
    };
  </script>
</body>
</html>
